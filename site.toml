# Site settings. Edit the dates and price here; the home page hero displays them.

title = "Winter Tech Forum"
tagline = "A Self-Organizing Open Spaces Conference & Retreat"
dates = "March 1-5, 2027"
place = "Crested Butte, Colorado"
price = "$750"
organizer = "Organized by Bruce Eckel"
formerly = "Formerly The Java Posse Roundup"

# Where the site is served. On Netlify the build takes the origin from the
# URL variable that Netlify sets, so this value matters for a local build.
origin = "https://www.wintertechforum.com"
base = ""         # A path prefix, for a host that serves the site below the root
preview = false   # true adds a noindex tag, so search engines skip a trial site

# The Sunday welcome dinner and the Saturday breakfast fall outside the
# conference dates. A page shows a value from this file where its text has
# the setting's name in double braces, as in {{ site.welcome_dinner }}.
welcome_dinner = "February 28"
saturday_breakfast = "March 6"

# Images. tools/make_images.py makes the first three from the artwork in art/.
banner = "/images/wtf-banner.webp"
logo = "/images/wtf-logo.jpg"
card = "/images/wtf-card.jpg"     # The picture a shared link shows
favicon = "/images/wtf-favicon-96.png"

# Navigation. An item is [name, url]; a url that starts with "/" is a page.
[[nav]]
group = "About"
items = [
    ["Overview", "/overview/"],
    ["Welcome Letter", "/welcome-letter/"],
    ["Conference Theme", "/conference-theme/"],
    ["Photos", "https://photos.app.goo.gl/ssVAP6nDTTLyqaF2A"],
    ["Code of Conduct", "/code-of-conduct/"],
]

[[nav]]
group = "Program"
items = [
    ["Open Spaces", "/open-spaces/"],
    ["Schedule", "/schedule/"],
    ["Conference App", "https://app.wintertechforum.com/"],
    ["Lightning Talks", "/lightning/"],
    ["Hackathon", "/hackathon/"],
    ["Afternoon Activities", "/afternoon/"],
]

[[nav]]
group = "Getting There"
items = [
    ["Location", "/location/"],
    ["Venue", "/venue/"],
    ["Travel", "/travel/"],
    ["Lodging", "/lodging/"],
    ["Health", "/health/"],
]

[[nav]]
group = "Organizer"
items = [
    ["Opening", "/opening-session/"],
    ["Ideas", "/ideas/"],
]
