# Site settings. Edit the dates and price here; the home page hero displays them.

title = "Winter Tech Forum"
tagline = "A Self-Organizing Open Spaces Conference & Retreat"
dates = "March 1-5, 2027"
place = "Crested Butte, Colorado"
price = "$750"
organizer = "Organized by Bruce Eckel"
formerly = "Formerly The Java Posse Roundup"

# Where the site is served. For the GitHub Pages preview the site lives under
# the repository name. For a custom domain, set base = "" and preview = false.
origin = "https://bruceeckel.github.io"
base = "/WinterTechForum-site"
preview = true    # true adds a noindex tag, so search engines skip the preview

banner = "/images/WinterTechForumBanner.png"
logo = "/images/wtf-web-nodate.jpg"
favicon = "/images/wtf-favicon-96.png"

# Navigation. An item is [name, url]; a url that starts with "/" is a page.
[[nav]]
group = "About"
items = [
    ["Overview", "/overview/"],
    ["Welcome Letter", "/welcome-letter/"],
    ["Conference Theme", "/conference-theme/"],
    ["Photos", "https://photos.app.goo.gl/ssVAP6nDTTLyqaF2A"],
    ["Code of Conduct", "https://github.com/WinterTechForum/wtf-code-of-conduct/blob/master/README.md"],
]

[[nav]]
group = "Program"
items = [
    ["Open Spaces", "/open-spaces/"],
    ["Schedule", "/schedule/"],
    ["Lightning Talks", "/lightning/"],
    ["Hackathon", "/hackathon/"],
    ["Afternoon Activities", "/afternoon/"],
]

[[nav]]
group = "Getting There"
items = [
    ["Location", "/location/"],
    ["Venue", "/venue/"],
    ["Travel", "/travel/"],
    ["Lodging", "/lodging/"],
    ["Health", "/health/"],
]

[[nav]]
group = "Organizer"
items = [
    ["Opening", "/opening-session/"],
    ["Ideas", "/ideas/"],
]
